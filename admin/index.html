<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理 — Acretiondisk</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f11;color:#d4d0c8;height:100vh;display:flex}
    .sidebar{width:300px;min-width:300px;background:#1a1a1e;border-right:1px solid #2a2a30;display:flex;flex-direction:column}
    .sidebar-header{padding:16px;border-bottom:1px solid #2a2a30}
    .sidebar-header h1{font-size:16px;color:#c8b080;letter-spacing:2px;margin-bottom:4px}
    .sidebar-header small{font-size:11px;color:#6a6a70}
    .sidebar-toolbar{padding:10px 16px;border-bottom:1px solid #2a2a30;display:flex;flex-wrap:wrap;gap:8px}
    .btn{padding:7px 14px;border:1px solid #3a3a40;background:#222228;color:#c8b080;cursor:pointer;font-size:12px;letter-spacing:1px;transition:all .15s}
    .btn:hover{background:#2a2a34;border-color:#5a5a60}
    .btn.primary{background:#2a2818;border-color:#5a5020}
    .btn.primary:hover{background:#3a3818}
    .btn.danger{color:#c06050;border-color:#4a3030}
    .btn.danger:hover{background:#3a2020;border-color:#6a3030}
    .btn.small{padding:4px 8px;font-size:10px}
    .post-list{flex:1;overflow-y:auto;padding:8px}
    .post-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #222228;transition:background .1s;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .post-item:hover{background:#1e1e24}
    .post-item.active{background:#22221a;border-left:2px solid #c8b080}
    .post-item .info{flex:1;min-width:0}
    .post-item .title{font-size:13px;color:#d4d0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .post-item .meta{font-size:10px;color:#6a6a70;margin-top:2px}
    .post-item .meta .draft-badge{color:#a08040;margin-left:6px}
    .post-item .actions{display:none;gap:4px}
    .post-item:hover .actions{display:flex}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .main-header{padding:12px 20px;border-bottom:1px solid #2a2a30;display:flex;justify-content:space-between;align-items:center;background:#16161a;gap:12px}
    .main-header h2{font-size:14px;color:#9a9a9e;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main-header .header-actions{display:flex;gap:6px;flex-shrink:0}
    .editor{flex:1;display:flex;flex-direction:column;padding:20px;overflow-y:auto;gap:14px}
    .form-group{display:flex;flex-direction:column;gap:4px}
    .form-group label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#6a6a70}
    .form-row{display:flex;gap:14px}
    .form-row .form-group{flex:1}
    input,textarea{background:#1a1a1e;border:1px solid #2a2a30;color:#d4d0c8;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;border-radius:2px}
    input:focus,textarea:focus{border-color:#5a5020}
    textarea{resize:vertical;min-height:100px}
    textarea.content-area{flex:1;min-height:300px;font-family:'Cascadia Code','Consolas',monospace;font-size:13px;line-height:1.6}
    .toggle-row{display:flex;align-items:center;gap:8px;margin-top:4px}
    .toggle-row span{font-size:11px;color:#9a9a9e;letter-spacing:1px}
    .toggle{width:36px;height:20px;background:#3a3a40;border-radius:10px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
    .toggle.on{background:#5a5020}
    .toggle::after{content:'';position:absolute;width:16px;height:16px;background:#d4d0c8;border-radius:50%;top:2px;left:2px;transition:left .2s}
    .toggle.on::after{left:18px}
    .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#4a4a50;font-size:13px;letter-spacing:2px}
    .upload-area{border:1px dashed #3a3a40;padding:16px;text-align:center;color:#6a6a70;font-size:11px;cursor:pointer;transition:all .15s;letter-spacing:1px;margin-bottom:10px;border-radius:2px}
    .upload-area:hover{border-color:#5a5020;color:#9a9080}
    .upload-area.dragover{border-color:#c8b080;background:#1a1a12}
    .toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;background:#2a2a18;border:1px solid #5a5020;color:#c8b080;font-size:12px;letter-spacing:1px;z-index:999;animation:fadeIn .2s}
    .tip-bar{background:#1a1a14;border-bottom:1px solid #2a2a20;padding:8px 20px;font-size:10px;color:#5a5a40;letter-spacing:1px;display:flex;gap:20px;flex-wrap:wrap}
    /* 模式切换 */
    .mode-tabs{display:flex;gap:0;margin-top:8px}
    .mode-tab{padding:4px 12px;border:1px solid #3a3a40;background:#1a1a1e;color:#6a6a70;cursor:pointer;font-size:10px;letter-spacing:1px;transition:all .15s;flex:1;text-align:center}
    .mode-tab:first-child{border-radius:2px 0 0 2px}
    .mode-tab:last-child{border-radius:0 2px 2px 0}
    .mode-tab:hover{color:#9a9a9e}
    .mode-tab.active{background:#2a2818;border-color:#5a5020;color:#c8b080}
    /* 画廊列表 */
    .gallery-list-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid #222228;transition:background .1s;display:flex;gap:10px;align-items:center}
    .gallery-list-item:hover{background:#1e1e24}
    .gallery-list-item.active{background:#22221a;border-left:2px solid #c8b080}
    .gallery-list-item img{width:48px;height:36px;object-fit:cover;border-radius:2px;flex-shrink:0;background:#1a1a1e}
    .gallery-list-item .info{flex:1;min-width:0}
    .gallery-list-item .title{font-size:12px;color:#d4d0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gallery-list-item .meta{font-size:10px;color:#6a6a70;margin-top:1px}
    .url-import-bar{display:flex;gap:6px;margin-top:6px}
    .url-import-bar input{flex:1;font-size:11px;padding:4px 8px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){body{flex-direction:column}.sidebar{width:100%;min-width:100%;max-height:40vh}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>ACR—ADMIN</h1>
      <small>博客内容管理系统</small>
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="posts">文章</button>
        <button class="mode-tab" data-mode="gallery">画廊</button>
        <button class="mode-tab" data-mode="guestbook">留言</button>
      </div>
    </div>
    <div class="sidebar-toolbar">
      <button class="btn primary" id="btnNew">＋ 新建</button>
      <button class="btn" id="btnRefresh">↻ 刷新</button>
      <button class="btn" id="btnPush" style="border-color:#3a6040;color:#80c080" title="推送文章/图片/画廊数据">⬆ 推送</button>
      <button class="btn" id="btnPushFull" style="border-color:#806040;color:#c0a080" title="推送全部改动（含页面代码等），排除 reasonix.toml">⬆ 全量推送</button>
      <button class="btn" id="btnSite" style="border-color:#3a4060;color:#80a0c0" title="打开博客网站">🌐</button>
    </div>
    <div class="post-list" id="postList"><div class="empty-state" style="padding:30px">加载中…</div></div>
  </aside>
  <main class="main">
    <div class="main-header">
      <h2 id="editorTitle">选择或创建一篇文章</h2>
      <div class="header-actions">
        <button class="btn primary" id="btnSave" disabled>💾 保存 (Ctrl+S)</button>
        <button class="btn danger" id="btnDelete" style="display:none">🗑 删除</button>
      </div>
    </div>
    <div class="tip-bar">
      <span>💡 粘贴图片自动上传</span>
      <span>⚡ Ctrl+S 保存</span>
      <span>⬆ 推送=内容 / 全量推送=含代码</span>
    </div>
    <div id="editorContainer"><div class="empty-state">← 从左侧列表选择文章，或点击「新建」</div></div>
  </main>
  <input type="file" id="fileInput" style="display:none" accept="image/*" />

  <script>
    const API = '/api/posts';
    const TOKEN = 'acr-admin';
    let currentSlug = null, posts = [];
    let currentMode = 'posts', galleryItems = [], currentGalleryId = null;
    // ── 留言（Waline）状态 ──
    let walineServer = localStorage.getItem('waline-server') || '';
    let walineToken = localStorage.getItem('waline-token') || '';
    let walineEmail = localStorage.getItem('waline-email') || '';
    let walineComments = [];
    const GALLERY_API = '/api/gallery';
    const $ = s => document.querySelector(s);

    async function apiFetch(url, opts = {}) {
      opts.headers = { ...(opts.headers || {}), 'x-admin-token': TOKEN };
      return fetch(url, opts);
    }

    async function loadPosts() {
      try {
        const res = await apiFetch(API);
        posts = await res.json();
        renderList();
      } catch(e) { toast('加载失败: '+e.message) }
    }

    function renderList() {
      const el = $('#postList');
      if(!posts.length){el.innerHTML='<div class="empty-state" style="padding:30px">暂无文章</div>';return}
      el.innerHTML = posts.map(p=>`
        <div class="post-item${p.slug===currentSlug?' active':''}" data-slug="${p.slug}">
          <div class="info" onclick="selectPost('${p.slug}')">
            <div class="title">${esc(p.title||p.slug)}</div>
            <div class="meta">${p.pubDate||''}${p.dayIndex?` · #${p.dayIndex}`:''}${p.draft?' <span class="draft-badge">草稿</span>':''}</div>
          </div>
          <div class="actions">
            <button class="btn small danger" onclick="event.stopPropagation();deletePost('${p.slug}')">×</button>
          </div>
        </div>`).join('');
    }

    async function selectPost(slug) {
      currentSlug = slug;
      try {
        const res = await apiFetch(`${API}/${slug}`);
        const post = await res.json();
        if(post.error){toast(post.error);return}
        renderEditor(post); renderList();
      } catch(e) { toast('加载失败') }
    }

    function renderEditor(post) {
      $('#editorTitle').textContent = '编辑：' + (post.title || post.slug);
      $('#btnDelete').style.display = '';
      $('#btnSave').disabled = false;
      $('#editorContainer').innerHTML = `
        <div class="editor">
          <div class="upload-area" id="uploadArea">📎 拖放或点击上传图片 → 自动插入 Markdown</div>
          <div class="url-import-bar">
            <input id="fImportUrl" placeholder="或粘贴外部图片 URL，点导入 →" />
            <button class="btn small" id="btnImportUrl">导入</button>
            <input id="fImportReferer" placeholder="防盗链 Referer（可选）" style="width:140px" title="如 Pixiv 需填 https://www.pixiv.net/" />
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>标题</label><input id="fTitle" value="${escAttr(post.title||'')}" placeholder="文章标题"/></div>
            <div class="form-group" style="flex:1"><label>Slug / URL</label><input id="fSlug" value="${escAttr(post.slug||'')}" placeholder="url-name"/></div>
          </div>
          <div class="form-group"><label>描述</label><input id="fDesc" value="${escAttr(post.description||'')}" placeholder="一句完整的文章简介"/></div>
          <div class="form-row">
            <div class="form-group"><label>发布日期</label><input id="fPubDate" type="date" value="${post.pubDate||''}"/></div>
            <div class="form-group"><label>同日序号</label><input id="fDayIndex" type="number" min="1" value="${post.dayIndex||''}" placeholder="自动" title="同一天内的发表顺序，1 = 当天第一篇；留空自动推导"/></div>
            <div class="form-group"><label>标签 (逗号分隔)</label><input id="fTags" value="${escAttr((post.tags||[]).join(', '))}" placeholder="博客, Astro"/></div>
          </div>
          <div class="toggle-row">
            <div class="toggle${post.draft?'':' on'}" id="fDraftToggle" onclick="toggleDraft()"></div>
            <span>发布</span><span style="font-size:10px;color:#6a6a70" id="draftStatus">${post.draft?'当前为草稿':'已发布'}</span>
          </div>
          <div class="form-group" style="flex:1"><label>正文 (Markdown)</label><textarea class="content-area" id="fContent">${esc(post.content||'')}</textarea></div>
        </div>`;
      setupUpload();
      // Focus title for new posts
      if(!post.title) $('#fTitle')?.focus();
    }

    function newPost() {
      currentSlug = null;
      $('#editorTitle').textContent = '新建文章';
      $('#btnDelete').style.display = 'none';
      $('#btnSave').disabled = false;
      const today = new Date().toISOString().split('T')[0];
      $('#editorContainer').innerHTML = `
        <div class="editor">
          <div class="upload-area" id="uploadArea">📎 拖放或点击上传图片 → 自动插入 Markdown</div>
          <div class="url-import-bar">
            <input id="fImportUrl" placeholder="或粘贴外部图片 URL，点导入 →" />
            <button class="btn small" id="btnImportUrl">导入</button>
            <input id="fImportReferer" placeholder="防盗链 Referer（可选）" style="width:140px" title="如 Pixiv 需填 https://www.pixiv.net/" />
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>标题</label><input id="fTitle" value="" placeholder="文章标题" autofocus/></div>
            <div class="form-group" style="flex:1"><label>Slug / URL</label><input id="fSlug" value="" placeholder="自动从标题生成"/></div>
          </div>
          <div class="form-group"><label>描述</label><input id="fDesc" value="" placeholder="一句完整的文章简介"/></div>
          <div class="form-row">
            <div class="form-group"><label>发布日期</label><input id="fPubDate" type="date" value="${today}"/></div>
            <div class="form-group"><label>同日序号</label><input id="fDayIndex" type="number" min="1" value="" placeholder="自动" title="同一天内的发表顺序，1 = 当天第一篇；留空自动推导"/></div>
            <div class="form-group"><label>标签 (逗号分隔)</label><input id="fTags" value="" placeholder="博客, Astro"/></div>
          </div>
          <div class="toggle-row">
            <div class="toggle on" id="fDraftToggle" onclick="toggleDraft()"></div>
            <span>发布</span><span style="font-size:10px;color:#6a6a70" id="draftStatus">已发布</span>
          </div>
          <div class="form-group" style="flex:1"><label>正文 (Markdown)</label><textarea class="content-area" id="fContent"></textarea></div>
        </div>`;
      setupUpload();
      renderList();
      $('#fTitle')?.focus();
    }

    async function savePost() {
      const title = $('#fTitle')?.value || '';
      const slug = $('#fSlug')?.value || '';
      const description = $('#fDesc')?.value || '';
      const pubDate = $('#fPubDate')?.value || '';
      const tags = $('#fTags')?.value || '';
      const content = $('#fContent')?.value || '';
      const draft = !$('#fDraftToggle')?.classList.contains('on');
      if(!title){toast('标题不能为空');return}

      const formData = new URLSearchParams();
      formData.set('title', title); formData.set('slug', slug);
      formData.set('description', description); formData.set('pubDate', pubDate);
      formData.set('dayIndex', $('#fDayIndex')?.value || '');
      formData.set('tags', tags); formData.set('content', content);
      formData.set('draft', String(draft));

      try {
        const url = currentSlug ? `${API}/${currentSlug}` : API;
        const method = currentSlug ? 'PUT' : 'POST';
        const res = await apiFetch(url, { method, body: formData, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        const data = await res.json();
        if(data.error){toast(data.error);return}
        toast(currentSlug?'已保存':'已创建'); currentSlug = data.slug;
        await loadPosts(); await selectPost(data.slug);
      } catch(e) { toast('保存失败: '+e.message) }
    }

    async function deletePost(slug) {
      if(!confirm(`确定删除「${slug}」？此操作不可撤销。`)) return;
      try {
        const res = await apiFetch(`${API}/${slug}`, { method:'DELETE' });
        const data = await res.json();
        if(data.error){toast(data.error);return}
        toast('已删除');
        if(currentSlug===slug){currentSlug=null;$('#editorContainer').innerHTML='<div class="empty-state">← 从左侧列表选择文章，或点击「新建」</div>';$('#btnDelete').style.display='none';$('#btnSave').disabled=true;$('#editorTitle').textContent='选择或创建一篇文章'}
        await loadPosts();
      } catch(e) { toast('删除失败') }
    }

    function toggleDraft() {
      const t = $('#fDraftToggle'); if(!t) return;
      t.classList.toggle('on');
      const s = $('#draftStatus'); if(s) s.textContent = t.classList.contains('on')?'已发布':'当前为草稿';
    }

    function setupUpload() {
      const area = $('#uploadArea'); if(!area) return;
      area.onclick = ()=>$('#fileInput').click();
      area.ondragover = e=>{e.preventDefault();area.classList.add('dragover')};
      area.ondragleave = ()=>area.classList.remove('dragover');
      area.ondrop = async e=>{e.preventDefault();area.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)await uploadImage(f)};
      $('#fileInput').onchange = async ()=>{const f=$('#fileInput').files[0];if(f){await uploadImage(f);$('#fileInput').value=''}};

      // URL import button
      const btnImport = $('#btnImportUrl');
      if (btnImport) btnImport.onclick = async () => {
        const url = $('#fImportUrl')?.value?.trim();
        if (!url) { toast('请粘贴图片 URL'); return; }
        btnImport.textContent = '⏳'; btnImport.disabled = true;
        try {
          const fd = new URLSearchParams();
          fd.set('url', url);
          fd.set('referer', $('#fImportReferer')?.value?.trim() || '');
          const res = await apiFetch('/api/import-url', { method: 'POST', body: fd, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
          const data = await res.json();
          if (data.error) { toast(data.error); btnImport.textContent = '导入'; btnImport.disabled = false; return; }
          if (currentMode === 'gallery') {
            const srcInput = $('#fSrc');
            if (srcInput) { srcInput.value = data.url; srcInput.focus(); }
          } else {
            const md = `![](${data.url})`;
            const ta = $('#fContent');
            if (ta) { const s = ta.selectionStart; ta.value = ta.value.substring(0, s) + md + '\n' + ta.value.substring(ta.selectionEnd); ta.focus(); }
          }
          toast('已导入: ' + data.url);
        } catch (e) { toast('导入失败: ' + e.message); }
        btnImport.textContent = '导入'; btnImport.disabled = false;
      };

      // Paste image support
      document.onpaste = async e => {
        const item = e.clipboardData?.items?.[0];
        if(item && item.type.startsWith('image/')) {
          e.preventDefault();
          await uploadImage(item.getAsFile());
        }
      };
    }

    async function uploadImage(file) {
      if(!file||!file.type.startsWith('image/')){toast('仅支持图片');return}
      toast('上传中…');
      const fd = new FormData(); fd.set('file', file);
      try {
        const res = await apiFetch('/api/upload', { method:'POST', body:fd });
        const data = await res.json();
        if(data.error){toast(data.error);return}
        if (currentMode === 'gallery') {
          const srcInput = $('#fSrc');
          if (srcInput) { srcInput.value = data.url; srcInput.focus(); }
          toast('已上传: ' + data.url);
        } else {
          const md = `![${file.name}](${data.url})`;
          const ta = $('#fContent');
          if(ta){const s=ta.selectionStart;ta.value=ta.value.substring(0,s)+md+'\n'+ta.value.substring(ta.selectionEnd);ta.focus()}
          toast('已上传: '+data.url);
        }
      } catch(e) { toast('上传失败') }
    }

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}

    document.addEventListener('keydown', e => {
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();currentMode==='gallery'?saveGalleryItem():currentMode==='guestbook'?null:savePost()}
    });

    loadPosts();

    // ── 模式切换 ──
    $('#modeTabs').addEventListener('click', e => {
      const tab = e.target.closest('.mode-tab');
      if (!tab || tab.dataset.mode === currentMode) return;
      switchMode(tab.dataset.mode);
    });

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      if (mode === 'gallery') {
        currentSlug = null;
        $('#editorTitle').textContent = '选择或创建一幅图像';
        $('#btnDelete').style.display = 'none';
        $('#btnSave').disabled = true;
        $('#editorContainer').innerHTML = '<div class="empty-state">← 从左侧列表选择图像，或点击「新建」</div>';
        loadGallery();
      } else if (mode === 'guestbook') {
        currentSlug = null;
        $('#editorTitle').textContent = '留言管理（Waline）';
        $('#btnDelete').style.display = 'none';
        $('#btnSave').style.display = 'none';
        $('#btnNew').style.display = 'none';
        $('#editorContainer').innerHTML = '<div class="empty-state">连接 Waline 服务后管理留言</div>';
        renderGuestbookList();
        loadGuestbookComments();
      } else {
        currentGalleryId = null;
        $('#editorTitle').textContent = '选择或创建一篇文章';
        $('#btnSave').style.display = '';
        $('#btnNew').style.display = '';
        $('#btnDelete').style.display = 'none';
        $('#btnSave').disabled = true;
        $('#editorContainer').innerHTML = '<div class="empty-state">← 从左侧列表选择文章，或点击「新建」</div>';
        loadPosts();
      }
    }

    // ── 按钮分发 ──
    $('#btnNew').onclick = () => currentMode === 'gallery' ? newGalleryItem() : newPost();
    $('#btnRefresh').onclick = () => currentMode === 'gallery' ? loadGallery() : currentMode === 'guestbook' ? loadGuestbookComments() : loadPosts();
    $('#btnSave').onclick = () => currentMode === 'gallery' ? saveGalleryItem() : savePost();
    $('#btnDelete').onclick = () => currentMode === 'gallery' ? (currentGalleryId && deleteGalleryItem(currentGalleryId)) : (currentSlug && deletePost(currentSlug));
    $('#btnPush').onclick = pushToGithub;
    $('#btnPushFull').onclick = pushToGithubFull;
    $('#btnSite').onclick = () => window.open('https://anacretiondisk9986.github.io/', '_blank');

    // ═══════════════════════════════════════
    // 画廊管理
    // ═══════════════════════════════════════

    async function loadGallery() {
      try {
        const res = await apiFetch(GALLERY_API);
        galleryItems = await res.json();
        renderGalleryList();
      } catch(e) { toast('加载画廊失败: '+e.message) }
    }

    function renderGalleryList() {
      const el = $('#postList');
      if(!galleryItems.length){el.innerHTML='<div class="empty-state" style="padding:30px">暂无独立收藏</div>';return}
      el.innerHTML = galleryItems.map(item=>`
        <div class="gallery-list-item${item.id===currentGalleryId?' active':''}" data-gallery-id="${item.id}">
          <img src="${item.src}" alt="${escAttr(item.alt||item.title)}" loading="lazy" onerror="this.style.display='none'" />
          <div class="info" onclick="selectGalleryItem('${item.id}')">
            <div class="title">${esc(item.title)}</div>
            <div class="meta">${item.date||'无日期'}${item.dayIndex?` · #${item.dayIndex}`:''}</div>
          </div>
          <div class="actions">
            <button class="btn small danger" onclick="event.stopPropagation();deleteGalleryItem('${item.id}')">×</button>
          </div>
        </div>`).join('');
    }

    async function selectGalleryItem(id) {
      currentGalleryId = id;
      try {
        const res = await apiFetch(`${GALLERY_API}/${id}`);
        const item = await res.json();
        if(item.error){toast(item.error);return}
        renderGalleryEditor(item); renderGalleryList();
      } catch(e) { toast('加载失败') }
    }

    function renderGalleryEditor(item) {
      $('#editorTitle').textContent = item.title ? '编辑：' + item.title : '编辑独立收藏';
      $('#btnDelete').style.display = '';
      $('#btnSave').disabled = false;
      $('#editorContainer').innerHTML = `
        <div class="editor">
          <div class="upload-area" id="uploadArea">📎 拖放或点击上传图片 → 自动填入图像地址</div>
          <div class="url-import-bar">
            <input id="fImportUrl" placeholder="或粘贴外部图片 URL，点导入 →" />
            <button class="btn small" id="btnImportUrl">导入</button>
            <input id="fImportReferer" placeholder="防盗链 Referer（可选）" style="width:140px" title="如 Pixiv 需填 https://www.pixiv.net/" />
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>图像地址 (src) *</label><input id="fSrc" value="${escAttr(item.src||'')}" placeholder="/image/example.jpg"/></div>
            <div class="form-group" style="flex:1"><label>日期</label><input id="fGalleryDate" type="date" value="${item.date||''}"/></div>
            <div class="form-group" style="flex:1"><label>同日序号</label><input id="fGalleryDayIndex" type="number" min="1" value="${item.dayIndex||''}" placeholder="自动" title="同一天内的顺序，1 = 当天最早；留空自动推导"/></div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>标题 *</label><input id="fGalleryTitle" value="${escAttr(item.title||'')}" placeholder="图像标题"/></div>
            <div class="form-group" style="flex:1"><label>替代文本 (alt)</label><input id="fAlt" value="${escAttr(item.alt||'')}" placeholder="屏幕阅读器描述"/></div>
          </div>
          <div class="form-group"><label>说明文字 (caption)</label><input id="fCaption" value="${escAttr(item.caption||'')}" placeholder="显示在图像下方的简短说明"/></div>
          <div class="form-row">
            <div class="form-group"><label>来源链接 (sourceUrl)</label><input id="fSourceUrl" value="${escAttr(item.sourceUrl||'')}" placeholder="https://..."/></div>
            <div class="form-group"><label>来源标题 (sourceTitle)</label><input id="fSourceTitle" value="${escAttr(item.sourceTitle||'')}" placeholder="来源名称"/></div>
          </div>
          <div style="margin-top:8px;padding:8px;background:#1a1a1e;border-radius:2px">
            <img src="${escAttr(item.src||'')}" alt="预览" style="max-width:100%;max-height:200px;display:block;margin:0 auto" onerror="this.style.display='none'" />
          </div>
        </div>`;
      setupUpload();
      if(!item.title) $('#fGalleryTitle')?.focus();
    }

    function newGalleryItem() {
      currentGalleryId = null;
      $('#editorTitle').textContent = '新建独立收藏';
      $('#btnDelete').style.display = 'none';
      $('#btnSave').disabled = false;
      const today = new Date().toISOString().split('T')[0];
      $('#editorContainer').innerHTML = `
        <div class="editor">
          <div class="upload-area" id="uploadArea">📎 拖放或点击上传图片 → 自动填入图像地址</div>
          <div class="url-import-bar">
            <input id="fImportUrl" placeholder="或粘贴外部图片 URL，点导入 →" />
            <button class="btn small" id="btnImportUrl">导入</button>
            <input id="fImportReferer" placeholder="防盗链 Referer（可选）" style="width:140px" title="如 Pixiv 需填 https://www.pixiv.net/" />
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>图像地址 (src) *</label><input id="fSrc" value="" placeholder="/image/example.jpg" autofocus/></div>
            <div class="form-group" style="flex:1"><label>日期</label><input id="fGalleryDate" type="date" value="${today}"/></div>
            <div class="form-group" style="flex:1"><label>同日序号</label><input id="fGalleryDayIndex" type="number" min="1" value="" placeholder="自动" title="同一天内的顺序，1 = 当天最早；留空自动推导"/></div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>标题 *</label><input id="fGalleryTitle" value="" placeholder="图像标题"/></div>
            <div class="form-group" style="flex:1"><label>替代文本 (alt)</label><input id="fAlt" value="" placeholder="屏幕阅读器描述"/></div>
          </div>
          <div class="form-group"><label>说明文字 (caption)</label><input id="fCaption" value="" placeholder="显示在图像下方的简短说明"/></div>
          <div class="form-row">
            <div class="form-group"><label>来源链接 (sourceUrl)</label><input id="fSourceUrl" value="" placeholder="https://..."/></div>
            <div class="form-group"><label>来源标题 (sourceTitle)</label><input id="fSourceTitle" value="" placeholder="来源名称"/></div>
          </div>
        </div>`;
      setupUpload();
      renderGalleryList();
      $('#fGalleryTitle')?.focus();
    }

    async function saveGalleryItem() {
      const src = $('#fSrc')?.value?.trim() || '';
      const title = $('#fGalleryTitle')?.value?.trim() || '';
      if(!src){toast('图像地址不能为空');return}
      if(!title){toast('标题不能为空');return}

      const formData = new URLSearchParams();
      formData.set('src', src);
      formData.set('alt', $('#fAlt')?.value || '');
      formData.set('title', title);
      formData.set('caption', $('#fCaption')?.value || '');
      formData.set('date', $('#fGalleryDate')?.value || '');
      formData.set('dayIndex', $('#fGalleryDayIndex')?.value || '');
      formData.set('sourceUrl', $('#fSourceUrl')?.value || '');
      formData.set('sourceTitle', $('#fSourceTitle')?.value || '');

      try {
        const url = currentGalleryId ? `${GALLERY_API}/${currentGalleryId}` : GALLERY_API;
        const method = currentGalleryId ? 'PUT' : 'POST';
        const res = await apiFetch(url, { method, body: formData, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        const data = await res.json();
        if(data.error){toast(data.error);return}
        toast(currentGalleryId?'已保存':'已创建');
        currentGalleryId = data.item?.id || currentGalleryId;
        await loadGallery();
        if (currentGalleryId) await selectGalleryItem(currentGalleryId);
      } catch(e) { toast('保存失败: '+e.message) }
    }

    async function deleteGalleryItem(id) {
      if(!confirm(`确定删除独立收藏「${id}」？此操作不可撤销。`)) return;
      try {
        const res = await apiFetch(`${GALLERY_API}/${id}`, { method:'DELETE' });
        const data = await res.json();
        if(data.error){toast(data.error);return}
        toast('已删除');
        if(currentGalleryId===id){currentGalleryId=null;$('#editorContainer').innerHTML='<div class="empty-state">← 从左侧列表选择图像，或点击「新建」</div>';$('#btnDelete').style.display='none';$('#btnSave').disabled=true;$('#editorTitle').textContent='选择或创建一幅图像'}
        await loadGallery();
      } catch(e) { toast('删除失败') }
    }

    // ═══════════════════════════════════════

    async function pushToGithub() {
      const btn = $('#btnPush');
      btn.textContent = '⏳ 推送中...';
      btn.disabled = true;
      try {
        const res = await apiFetch('/api/push', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          toast(data.message || '推送成功');
        } else {
          toast('推送失败: ' + (data.error || data.detail || '未知错误'));
        }
      } catch (e) {
        toast('推送失败: ' + e.message);
      }
      btn.textContent = '⬆ 推送';
      btn.disabled = false;
    }

    async function pushToGithubFull() {
      const btn = $('#btnPushFull');
      btn.textContent = '⏳ 全量推送中...';
      btn.disabled = true;
      try {
        const res = await apiFetch('/api/push-full', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          toast(data.message || '全量推送成功');
        } else {
          toast('全量推送失败: ' + (data.error || data.detail || '未知错误'));
        }
      } catch (e) {
        toast('全量推送失败: ' + e.message);
      }
      btn.textContent = '⬆ 全量推送';
      btn.disabled = false;
    }

    // ═══════════════════════════════════════
    // 留言管理（Waline）
    // ═══════════════════════════════════════

    function guestbookConfigured() {
      return !!(walineServer && walineToken);
    }

    /** 侧边栏：连接状态提示 */
    function renderGuestbookList() {
      const el = $('#postList');
      if (guestbookConfigured()) {
        el.innerHTML = `
          <div style="padding:12px 14px;font-size:11px;color:#6a6a70;line-height:1.8">
            <div style="color:#80a080">● 已连接 Waline</div>
            <div>服务：${esc(walineServer)}</div>
            <div>账号：${esc(walineEmail || '-')}</div>
            <div>留言：${walineComments.length} 条</div>
          </div>`;
      } else {
        el.innerHTML = `
          <div style="padding:12px 14px;font-size:11px;color:#6a6a70;line-height:1.8">
            <div style="color:#a08040">○ 未连接 Waline 服务</div>
            <div>在右侧填入服务地址与管理员账号。</div>
          </div>`;
      }
    }

    /** 右侧：连接表单 / 留言列表 */
    function renderGuestbookPanel() {
      if (!guestbookConfigured()) {
        $('#editorTitle').textContent = '留言管理 — 连接 Waline';
        $('#editorContainer').innerHTML = `
          <div class="editor" style="max-width:640px">
            <div class="form-group"><label>Waline 服务地址 (serverURL) *</label>
              <input id="gServer" value="${escAttr(walineServer)}" placeholder="https://your-waline.vercel.app" />
              <small style="color:#5a5a50;font-size:10px;margin-top:2px">部署见 docs/WALINE_DEPLOY.md；本地预览填 http://127.0.0.1:8765（需先运行 node scripts/mock-waline.mjs）</small>
            </div>
            <div class="form-row">
              <div class="form-group"><label>管理员邮箱 *</label><input id="gEmail" type="email" value="${escAttr(walineEmail)}" placeholder="admin@example.com" /></div>
              <div class="form-group"><label>管理员密码 *</label><input id="gPassword" type="password" placeholder="••••••••" /></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:6px">
              <button class="btn primary" id="btnConnect">🔑 连接并加载留言</button>
              <button class="btn" id="btnForget">忘记配置</button>
            </div>
            <div class="tip-bar" style="margin-top:14px;border:1px solid #2a2a20">
              <span>提示：Waline 部署后，第一个注册的账号即为管理员；此处使用该账号登录以获取管理令牌。</span>
            </div>
          </div>`;
        $('#btnConnect').onclick = connectGuestbook;
        $('#btnForget').onclick = () => {
          walineServer = ''; walineToken = ''; walineEmail = '';
          localStorage.removeItem('waline-server');
          localStorage.removeItem('waline-token');
          localStorage.removeItem('waline-email');
          renderGuestbookPanel(); renderGuestbookList();
        };
        return;
      }

      $('#editorTitle').textContent = `留言管理 — ${walineComments.length} 条`;
      $('#editorContainer').innerHTML = `
        <div class="editor">
          <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
            <span style="font-size:11px;color:#80a080">● ${esc(walineServer)}</span>
            <button class="btn small" id="btnReconnect">重新连接</button>
            <button class="btn small" id="btnGRefresh">↻ 刷新</button>
          </div>
          <div id="gCommentList"></div>
        </div>`;
      $('#btnReconnect').onclick = () => {
        walineToken = '';
        localStorage.removeItem('waline-token');
        renderGuestbookPanel(); renderGuestbookList();
      };
      $('#btnGRefresh').onclick = loadGuestbookComments;
      renderGuestbookComments();
    }

    async function connectGuestbook() {
      const server = $('#gServer')?.value?.trim().replace(/\/+$/, '') || '';
      const email = $('#gEmail')?.value?.trim() || '';
      const password = $('#gPassword')?.value || '';
      if (!server || !email || !password) { toast('请填写服务地址、邮箱与密码'); return; }
      const btn = $('#btnConnect');
      btn.textContent = '⏳ 连接中...'; btn.disabled = true;
      try {
        const res = await fetch(`${server}/api/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();
        if (!res.ok || json.errno) throw new Error(json.errmsg || `HTTP ${res.status}`);
        walineServer = server;
        walineToken = json.data.token;
        walineEmail = email;
        localStorage.setItem('waline-server', server);
        localStorage.setItem('waline-token', walineToken);
        localStorage.setItem('waline-email', email);
        toast('已连接 Waline');
        await loadGuestbookComments();
        renderGuestbookPanel();
      } catch (e) {
        toast('连接失败: ' + e.message);
        btn.textContent = '🔑 连接并加载留言'; btn.disabled = false;
      }
    }

    async function loadGuestbookComments() {
      if (!guestbookConfigured()) { renderGuestbookPanel(); return; }
      try {
        const res = await fetch(`${walineServer}/api/comment?type=list&pageSize=100&page=1`, {
          headers: { 'Authorization': `Bearer ${walineToken}` },
        });
        const json = await res.json();
        if (!res.ok || json.errno) {
          if (res.status === 401) {
            walineToken = '';
            localStorage.removeItem('waline-token');
            renderGuestbookPanel();
            toast('令牌已失效，请重新连接');
          }
          throw new Error(json.errmsg || `HTTP ${res.status}`);
        }
        walineComments = json.data?.data || [];
        renderGuestbookList();
        renderGuestbookPanel();
      } catch (e) {
        toast('加载留言失败: ' + e.message);
      }
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      div.querySelectorAll('img, svg, script, iframe').forEach(el => el.remove());
      return (div.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function renderGuestbookComments() {
      const el = $('#gCommentList');
      if (!el) return;
      if (!walineComments.length) {
        el.innerHTML = '<div class="empty-state" style="padding:40px">暂无留言</div>';
        return;
      }
      el.innerHTML = walineComments.map(c => {
        const time = c.time ? new Date(c.time).toLocaleString('zh-CN', { hour12: false }) : (c.insertedAt || '');
        const status = c.status === 'approved' ? '' : ` <span style="color:#a08040">[${esc(c.status || '?')}]</span>`;
        const text = stripHtml(c.comment).slice(0, 120) + (stripHtml(c.comment).length > 120 ? '…' : '');
        return `
          <div style="padding:12px 14px;border-bottom:1px solid #222228;background:#16161a;margin-bottom:8px;border-radius:2px">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px">
              <b style="color:#c8b080">${esc(c.nick || '匿名')}</b>
              <span style="color:#6a6a70">IP属地：${esc(c.addr || '未知')}</span>
              <span style="color:#4a4a50" title="原始 IP">(${esc(c.ip || '')})</span>
              <span style="color:#6a6a70">${esc(c.mail || '')}</span>
              <span style="color:#4a4a50;margin-left:auto">${esc(time)}</span>${status}
            </div>
            <div style="font-size:12px;color:#d4d0c8;margin-top:6px;line-height:1.7">${esc(text || '(空)')}</div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="btn small danger" data-gb-delete="${escAttr(c.objectId)}">🗑 删除</button>
            </div>
          </div>`;
      }).join('');
      el.querySelectorAll('[data-gb-delete]').forEach(btn => {
        btn.addEventListener('click', () => deleteGuestbookComment(btn.getAttribute('data-gb-delete') || ''));
      });
    }

    async function deleteGuestbookComment(objectId) {
      if (!confirm('确定删除这条留言？此操作不可撤销。')) return;
      try {
        const res = await fetch(`${walineServer}/api/comment/${objectId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${walineToken}` },
        });
        const json = await res.json();
        if (!res.ok || json.errno) throw new Error(json.errmsg || `HTTP ${res.status}`);
        toast('已删除留言');
        await loadGuestbookComments();
      } catch (e) {
        toast('删除失败: ' + e.message);
      }
    }
  </script>
</body>
</html>
